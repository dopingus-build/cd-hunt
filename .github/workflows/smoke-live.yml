name: Live Deployment Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live GitHub Pages and Cloudflare Worker deployment
        run: node --test scripts/smoke-live.mjs
