name: Live Deployment Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  deployment_status:

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live GitHub Pages and Cloudflare Worker deployment
        run: node --test scripts/smoke-live.mjs
